<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · Racing &amp; Weather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236ea8ff'/><stop offset='1' stop-color='%23b98cff'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

  <section id="hero" class="hero card"></section>

  <section class="section">
    <div class="section-head">
      <h2>下一站赛道天气</h2>
      <span class="hint" id="race-hint">按 F1 官方赛历</span>
    </div>
    <div class="round-grid" id="races"></div>
    <div class="row" style="margin-top:14px">
      <a class="btn" href="weather.html">查看完整赛历天气 →</a>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>最新资讯</h2>
      <span class="hint">
        <button class="btn" id="refresh">刷新</button>
      </span>
    </div>
    <div class="feed" id="feed"></div>
    <div class="row" style="margin-top:14px">
      <a class="btn" href="news.html">查看全部订阅 →</a>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>资讯源</h2></div>
    <div class="source-grid" id="sources"></div>
  </section>

</div>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/news.js"></script>
<script src="assets/translate.js"></script>
<script src="assets/f1calendar.js"></script>
<script src="assets/weather.js"></script>
<script>
mountChrome('home');
renderHero(document.getElementById('hero'));
renderSourceCards(document.getElementById('sources'));

function loadNews() {
  renderNews(document.getElementById('feed'), { limit: 8 });
}
loadNews();

document.getElementById('refresh').addEventListener('click', function () {
  clearCache();
  loadNews();
});

renderCalendarWeather(document.getElementById('races'), { count: 3 }).then(function () {
  var cal = window.F1_CALENDAR;
  if (cal) document.getElementById('race-hint').textContent = cal.year + ' 赛季 · 共 ' + cal.rounds.length + ' 站';
});
</script>
</body>
</html>
