<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订阅 · Racing &amp; Weather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236ea8ff'/><stop offset='1' stop-color='%23b98cff'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

  <section class="section" style="margin-top:34px">
    <div class="section-head">
      <h2>资讯流</h2>
      <span class="hint">
        抓取自各站官方 RSS / 页面 ·
        <button class="btn" id="refresh">刷新</button>
      </span>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>订阅源</h2></div>
    <div class="source-grid" id="sources"></div>
  </section>

</div>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/news.js"></script>
<script src="assets/translate.js"></script>
<script>
mountChrome('news');
renderSourceCards(document.getElementById('sources'));

function load() {
  renderNews(document.getElementById('feed'), { groupBy: true });
}
load();

document.getElementById('refresh').addEventListener('click', function () {
  clearCache();
  load();
});
</script>
</body>
</html>
