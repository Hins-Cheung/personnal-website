<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气 · Racing &amp; Weather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236ea8ff'/><stop offset='1' stop-color='%23b98cff'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

  <section class="section" style="margin-top:34px">
    <div class="section-head">
      <h2>赛历天气</h2>
      <span class="hint" id="cal-hint">按 F1 官方赛历 · 每个分站的比赛周末</span>
    </div>
    <div class="round-grid" id="races"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="toggle-all">展开全部 23 站</button>
      <span class="muted" style="font-size:.8rem">已结束的分站显示历史实测值，未来 15 天内显示预报，更远的只显示赛道实况</span>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>常驻城市</h2>
      <span class="hint">可在 config.js 的 cities 里修改</span>
    </div>
    <div class="city-grid" id="cities"></div>
  </section>

</div>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/f1calendar.js"></script>
<script src="assets/weather.js"></script>
<script>
mountChrome('weather');

var showingAll = false;
var btn = document.getElementById('toggle-all');

function loadRounds() {
  var cal = window.F1_CALENDAR;
  if (cal) {
    document.getElementById('cal-hint').textContent =
      cal.year + ' 赛季 · 共 ' + cal.rounds.length + ' 站 · 每个分站的比赛周末';
    btn.textContent = showingAll ? '只看接下来 3 站' : '展开全部 ' + cal.rounds.length + ' 站';
  }
  renderCalendarWeather(document.getElementById('races'), { count: 3, all: showingAll });
}

btn.addEventListener('click', function () {
  showingAll = !showingAll;
  loadRounds();
});

loadRounds();
renderCities(document.getElementById('cities'));
</script>
</body>
</html>
